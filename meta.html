<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding: ensures correct text rendering -->
    <meta charset="UTF-8">

    <!-- Viewport: enables responsive scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Description: short summary used by search engines / previews -->
    <meta name="description" content="It Courses">

    <!-- Keywords: comma-separated keywords (mostly ignored by major search engines today) -->
    <meta name="keywords" content="Web designing cources in pune, IT courses in Shivaji nagar area, Java Full stack courses,MREN,React classes,!00% gyrantee olacement classes in IT Field">

    <!-- Author: declares the page author -->
    <meta name="author" content="author name">

    <!-- HTTP-EQUIV refresh: instructs browser to reload after N seconds (120 here). Use sparingly for usability/accessibility -->
    <meta http-equiv="refresh" content="120">

    <!-- Custom/meta value: 'AC' is non-standard — this will not be interpreted like robots meta.
         If you meant robots directives, use: <meta name="robots" content="index,follow"> -->
    <meta name="AC" content="follow,index1">
    
    <title>META tag</title>
</head>
<body>
    
</body>
</html>
