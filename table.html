<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="2" cellspacing="30px" cellpadding="10px" style="border-collapse: collapse;">
        <tr>
            <th>Number</th>
            <th>Name</th>
            <th>Weight</th>
            <th>Amount</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Aman</td>
            <td>65kg</td>
            <td>9000</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Omkar</td>
            <td>65kg</td>
            <td>7000</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Vinayak</td>
            <td>65kg</td>
            <td>4000</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Amol</td>
            <td>65kg</td>
            <td>8000</td>
        </tr>
    </table>
    <br>
    <table border="2" cellspacing="20px" cellpadding="20px" style="border-collapse: collapse;">
        <tr>
            <th>Month</th>
            <th>Saving</th>       
        </tr>
        <tr>
            <td>Jan</td>
            <td>₹54</td>
        </tr>
        <tr>
            <td>Feb</td>
            <td>₹94</td>
        </tr>
        <tr>
            <td colspan="3">230</td>
        </tr>
    </table>
</body>
</html>
